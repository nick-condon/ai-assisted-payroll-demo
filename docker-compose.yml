# demo_local_password is a fictional local-only database password.
# It is not a production secret. This file does not load .env.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_local_password
      POSTGRES_DB: payroll_demo
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d payroll_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3010:3000"
    environment:
      DATABASE_URL: postgresql://demo:demo_local_password@db:5432/payroll_demo
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "node dist/db/migrateCli.js && node dist/seedCli.js && node dist/server.js"]
